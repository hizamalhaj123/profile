<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي - حزام الحاج</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border-top: 4px solid #38bdf8;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 10px;
            font-size: 24px;
        }
        p {
            font-size: 18px;
            margin: 10px 0;
            color: #cbd5e1;
        }
        .badge {
            display: inline-block;
            background-color: #0284c7;
            color: white;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 14px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>حزام علي حزام الحاج</h1>
        <p><strong>العمر:</strong> 20 سنة</p>
        <p><strong>التخصص:</strong> أمن سيبراني</p>
        <div class="badge">المستوى: سنة ثانية</div>
    </div>

</body>
</html>
